# Servidor
server.port=8080

# Banco de dados
spring.datasource.url=jdbc:postgresql://localhost:5432/rafalink_crm
spring.datasource.username=rafalink_user
spring.datasource.password=rafalink123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# spring.flyway.debug=true
# logging.level.org.flywaydb=DEBUG

# Logs
logging.level.br.com.rafalink=DEBUG