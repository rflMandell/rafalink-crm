<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Detalhe do Agendamento', ~{::conteudo})}">
<body>
<th:block th:fragment="conteudo">

    <div class="d-flex align-items-center gap-2 mb-4">
        <a th:href="@{/view/agendamentos}" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h5 class="fw-bold mb-0">Detalhe do Agendamento</h5>
    </div>

    <div class="row g-3">
        <div class="col-lg-7">
            <div class="form-card">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <div class="stat-icon" style="background:#fff7ed; width:56px; height:56px;">
                        <i class="bi bi-calendar-event-fill fs-4" style="color:#d97706;"></i>
                    </div>
                    <div>
                        <h5 class="mb-0 fw-bold" th:text="${agendamento.titulo}"></h5>
                        <small class="text-muted"
                               th:text="${#temporals.format(agendamento.dataHora, 'dd/MM/yyyy HH:mm')}">
                        </small>
                    </div>
                    <span class="badge rounded-pill px-3 py-2 ms-auto"
                          th:text="${agendamento.status}"
                          th:classappend="'badge-' + ${agendamento.status.name().toLowerCase()}">
                    </span>
                </div>

                <div class="row g-3">
                    <div class="col-6">
                        <label class="text-muted" style="font-size:.78rem; font-weight:600;">ID</label>
                        <p class="mb-0 fw-semibold" th:text="'#' + ${agendamento.id}"></p>
                    </div>
                    <div class="col-6">
                        <label class="text-muted" style="font-size:.78rem; font-weight:600;">RESPONSÁVEL</label>
                        <p class="mb-0" th:text="${agendamento.usuarioNome ?: '—'}"></p>
                    </div>
                    <div class="col-6">
                        <label class="text-muted" style="font-size:.78rem; font-weight:600;">LEAD VINCULADO</label>
                        <p class="mb-0">
                            <a th:if="${agendamento.leadId != null}"
                               th:href="@{'/view/leads/' + ${agendamento.leadId}}"
                               th:text="${agendamento.leadNome}">
                            </a>
                            <span th:unless="${agendamento.leadId != null}" class="text-muted">—</span>
                        </p>
                    </div>
                    <div class="col-6">
                        <label class="text-muted" style="font-size:.78rem; font-weight:600;">CRIADO EM</label>
                        <p class="mb-0" th:text="${#temporals.format(agendamento.criadoEm, 'dd/MM/yyyy HH:mm')}"></p>
                    </div>
                    <div class="col-12" th:if="${agendamento.descricao}">
                        <label class="text-muted" style="font-size:.78rem; font-weight:600;">DESCRIÇÃO</label>
                        <p class="mb-0" th:text="${agendamento.descricao}"></p>
                    </div>
                </div>

                <!-- Ação: cancelar -->
                <div th:if="${agendamento.status.name() == 'AGENDADO'}"
                     class="mt-4 pt-3 border-top">
                    <form th:action="@{'/view/agendamentos/' + ${agendamento.id} + '/cancelar'}" method="post">
                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                onclick="return confirm('Cancelar este agendamento?')">
                            <i class="bi bi-x-circle me-1"></i> Cancelar agendamento
                        </button>
                    </form>
                </div>
                <div th:unless="${agendamento.status.name() == 'AGENDADO'}"
                     class="mt-4 pt-3 border-top">
                    <p class="text-muted small mb-0">
                        <i class="bi bi-lock me-1"></i>
                        Somente agendamentos com status <strong>AGENDADO</strong> podem ser cancelados.
                    </p>
                </div>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="form-card h-100">
                <h6 class="fw-semibold mb-3"><i class="bi bi-braces me-2"></i>Endpoints JSON</h6>
                <div class="mb-3">
                    <span class="badge bg-success me-2">GET</span>
                    <code th:text="'/api/agendamentos/' + ${agendamento.id}" style="font-size:.82rem;"></code>
                    <p class="text-muted mt-1 mb-0" style="font-size:.8rem;">Retorna dados em JSON</p>
                </div>
                <div class="mb-3">
                    <span class="badge bg-success me-2">GET</span>
                    <code th:text="'/api/agendamentos/usuario/' + ${agendamento.usuarioId}" style="font-size:.82rem;"></code>
                    <p class="text-muted mt-1 mb-0" style="font-size:.8rem;">Lista agendamentos do usuário</p>
                </div>
                <div th:if="${agendamento.leadId != null}" class="mb-3">
                    <span class="badge bg-success me-2">GET</span>
                    <code th:text="'/api/agendamentos/lead/' + ${agendamento.leadId}" style="font-size:.82rem;"></code>
                    <p class="text-muted mt-1 mb-0" style="font-size:.8rem;">Lista agendamentos do lead</p>
                </div>
                <div>
                    <span class="badge bg-warning text-dark me-2">PATCH</span>
                    <code th:text="'/api/agendamentos/' + ${agendamento.id} + '/cancelar'" style="font-size:.82rem;"></code>
                    <p class="text-muted mt-1 mb-0" style="font-size:.8rem;">Cancela · 200 OK ou 422</p>
                </div>
            </div>
        </div>
    </div>

</th:block>
</body>
</html>
