<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Detalhe da Campanha', ~{::conteudo})}">
<body>
<th:block th:fragment="conteudo">

    <div class="d-flex align-items-center gap-2 mb-4">
        <a th:href="@{/view/campanhas}" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h5 class="fw-bold mb-0">Detalhe da Campanha</h5>
    </div>

    <div class="row g-3">
        <div class="col-lg-7">
            <div class="form-card">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <div class="stat-icon" style="background:#fdf4ff; width:56px; height:56px;">
                        <i class="bi bi-megaphone-fill fs-4" style="color:#9333ea;"></i>
                    </div>
                    <div>
                        <h5 class="mb-0 fw-bold" th:text="${campanha.nome}"></h5>
                        <small class="text-muted" th:text="${campanha.descricao ?: 'Sem descrição'}"></small>
                    </div>
                    <span class="badge rounded-pill px-3 py-2 ms-auto"
                          th:classappend="${campanha.ativa} ? 'badge-ativo' : 'badge-inativo'"
                          th:text="${campanha.ativa} ? 'Ativa' : 'Encerrada'">
                    </span>
                </div>

                <div class="row g-3">
                    <div class="col-6">
                        <label class="text-muted" style="font-size:.78rem; font-weight:600;">ID</label>
                        <p class="mb-0 fw-semibold" th:text="'#' + ${campanha.id}"></p>
                    </div>
                    <div class="col-6">
                        <label class="text-muted" style="font-size:.78rem; font-weight:600;">CANAL</label>
                        <p class="mb-0">
                            <span class="badge rounded-pill px-2"
                                  th:text="${campanha.canal}"
                                  th:classappend="${campanha.canal.name() == 'EMAIL'} ? 'bg-primary' :
                                                 (${campanha.canal.name() == 'WHATSAPP'} ? 'bg-success' :
                                                 (${campanha.canal.name() == 'SMS'} ? 'bg-warning text-dark' : 'bg-info text-dark'))">
                            </span>
                        </p>
                    </div>
                    <div class="col-6">
                        <label class="text-muted" style="font-size:.78rem; font-weight:600;">DATA DE INÍCIO</label>
                        <p class="mb-0" th:text="${#temporals.format(campanha.inicio, 'dd/MM/yyyy')}"></p>
                    </div>
                    <div class="col-6">
                        <label class="text-muted" style="font-size:.78rem; font-weight:600;">DATA DE FIM</label>
                        <p class="mb-0" th:text="${campanha.fim != null} ? ${#temporals.format(campanha.fim, 'dd/MM/yyyy')} : '—'"></p>
                    </div>
                    <div class="col-6">
                        <label class="text-muted" style="font-size:.78rem; font-weight:600;">CRIADA EM</label>
                        <p class="mb-0" th:text="${#temporals.format(campanha.criadoEm, 'dd/MM/yyyy HH:mm')}"></p>
                    </div>
                </div>

                <!-- Ação: encerrar -->
                <div th:if="${campanha.ativa}" class="mt-4 pt-3 border-top">
                    <form th:action="@{'/view/campanhas/' + ${campanha.id} + '/encerrar'}" method="post">
                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                onclick="return confirm('Encerrar esta campanha? A data de fim será definida como hoje.')">
                            <i class="bi bi-stop-circle me-1"></i> Encerrar campanha
                        </button>
                    </form>
                    <small class="text-muted d-block mt-1">A data de fim será definida como a data atual.</small>
                </div>
                <div th:unless="${campanha.ativa}" class="mt-4 pt-3 border-top">
                    <p class="text-muted small mb-0">
                        <i class="bi bi-lock me-1"></i>
                        Esta campanha já está encerrada.
                    </p>
                </div>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="form-card h-100">
                <h6 class="fw-semibold mb-3"><i class="bi bi-braces me-2"></i>Endpoints JSON</h6>
                <div class="mb-3">
                    <span class="badge bg-success me-2">GET</span>
                    <code th:text="'/api/campanhas/' + ${campanha.id}" style="font-size:.82rem;"></code>
                    <p class="text-muted mt-1 mb-0" style="font-size:.8rem;">Retorna dados da campanha em JSON</p>
                </div>
                <div class="mb-3">
                    <span class="badge bg-success me-2">GET</span>
                    <code>/api/campanhas</code>
                    <p class="text-muted mt-1 mb-0" style="font-size:.8rem;">Lista somente campanhas ativas</p>
                </div>
                <div class="mb-3">
                    <span class="badge bg-success me-2">GET</span>
                    <code>/api/campanhas/todas</code>
                    <p class="text-muted mt-1 mb-0" style="font-size:.8rem;">Lista todas as campanhas</p>
                </div>
                <div>
                    <span class="badge bg-warning text-dark me-2">PATCH</span>
                    <code th:text="'/api/campanhas/' + ${campanha.id} + '/encerrar'" style="font-size:.82rem;"></code>
                    <p class="text-muted mt-1 mb-0" style="font-size:.8rem;">Encerra · 200 OK ou 422</p>
                </div>
            </div>
        </div>
    </div>

</th:block>
</body>
</html>
